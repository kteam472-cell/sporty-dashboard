<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPORTY — Today's Picks</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #1a1a2e;
    --card:    #16213e;
    --border:  #1e2d5a;
    --green:   #53d337;
    --red:     #ef4444;
    --amber:   #f59e0b;
    --gray:    #6b7280;
    --text:    #ffffff;
    --sub:     #94a3b8;
    --header:  #0d0d1a;
    --mlb:     #3b82f6;
    --nba:     #f97316;
    --ufc:     #ef4444;
    --nfl:     #53d337;
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  /* HEADER */
  header {
    background: var(--header);
    border-bottom: 2px solid var(--green);
    padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  .logo { font-size: 1.5rem; font-weight: 900; letter-spacing: 3px; }
  .logo span { color: var(--green); }
  .header-right { text-align: right; }
  .header-date { font-size: 0.85rem; font-weight: 700; color: var(--text); }
  .header-updated { font-size: 0.7rem; color: var(--sub); }

  /* SECTION HEADER */
  .section-header {
    padding: 20px 20px 10px;
    max-width: 960px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
  }
  .section-title {
    font-size: 0.75rem; font-weight: 800; letter-spacing: 2px;
    text-transform: uppercase; color: var(--sub);
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::before { content: ''; display: block; width: 3px; height: 14px; background: var(--green); border-radius: 2px; }
  .section-count { font-size: 0.7rem; color: var(--sub); background: var(--card); border: 1px solid var(--border); padding: 2px 8px; border-radius: 10px; }

  /* FILTERS */
  .filter-bar {
    padding: 12px 20px 4px;
    max-width: 960px; margin: 0 auto;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .pill {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 5px 14px; font-size: 0.78rem; font-weight: 600; color: var(--sub);
    cursor: pointer; transition: all 0.15s; user-select: none;
  }
  .pill:hover { border-color: var(--green); color: var(--text); }
  .pill.active { background: var(--green); border-color: var(--green); color: #000; font-weight: 800; }

  /* PICKS GRID */
  .picks-grid {
    padding: 8px 20px 4px;
    max-width: 960px; margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }

  /* PICK CARD */
  .pick-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
    transition: transform 0.15s, border-color 0.15s;
    cursor: pointer; position: relative;
  }
  .pick-card:hover { transform: translateY(-2px); border-color: #2a4080; }
  .pick-card.won  { border-left: 3px solid var(--green); }
  .pick-card.lost { border-left: 3px solid var(--red); }
  .pick-card.push { border-left: 3px solid var(--gray); }

  /* Sporty badge */
  .sporty-tag {
    position: absolute; top: 10px; right: 10px;
    background: rgba(83,211,55,0.15); border: 1px solid rgba(83,211,55,0.4);
    color: var(--green); font-size: 0.62rem; font-weight: 800;
    padding: 2px 7px; border-radius: 4px; letter-spacing: 0.5px;
  }

  .card-top { padding: 12px 14px 10px; border-bottom: 1px solid var(--border); }
  .card-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }

  .sport-badge {
    padding: 2px 8px; border-radius: 3px;
    font-size: 0.65rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
  }
  .sport-MLB { background: rgba(59,130,246,0.2); color: #60a5fa; }
  .sport-NBA { background: rgba(249,115,22,0.2); color: #fb923c; }
  .sport-UFC { background: rgba(239,68,68,0.2); color: #f87171; }
  .sport-NFL { background: rgba(83,211,55,0.2); color: var(--green); }

  .type-badge {
    padding: 2px 8px; border-radius: 3px;
    font-size: 0.65rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
    background: rgba(148,163,184,0.1); color: var(--sub);
  }

  .game-name { font-size: 0.82rem; color: var(--sub); margin-bottom: 3px; }
  .game-time-small { font-size: 0.7rem; color: #64748b; }

  .card-body { padding: 10px 14px 12px; }
  .pick-main { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .pick-label { font-size: 1rem; font-weight: 800; color: var(--text); }
  .pick-odds-val { font-size: 1rem; font-weight: 800; color: var(--green); }

  .conf-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .conf-dots { display: flex; gap: 4px; }
  .conf-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); }
  .conf-dot.on { background: var(--green); }
  .conf-dot.on.med { background: #a3d96e; }
  .conf-dot.on.low { background: var(--amber); }
  .conf-text { font-size: 0.72rem; color: var(--sub); }
  .edge-chip { font-size: 0.7rem; font-weight: 700; color: var(--green); background: rgba(83,211,55,0.1); padding: 2px 7px; border-radius: 4px; margin-left: auto; }

  .reasoning-text { font-size: 0.78rem; color: var(--sub); line-height: 1.5; padding-top: 8px; border-top: 1px solid var(--border); }

  .card-footer { padding: 8px 14px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .units-info { font-size: 0.7rem; color: var(--sub); }
  .units-info span { color: var(--green); font-weight: 800; }
  .status-chip {
    font-size: 0.65rem; font-weight: 800; letter-spacing: 0.5px; padding: 2px 8px; border-radius: 4px;
  }
  .status-PENDING { background: rgba(245,158,11,0.12); color: var(--amber); border: 1px solid rgba(245,158,11,0.3); }
  .status-WON  { background: rgba(83,211,55,0.12); color: var(--green); border: 1px solid rgba(83,211,55,0.3); }
  .status-LOST { background: rgba(239,68,68,0.12); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
  .status-PUSH { background: rgba(107,114,128,0.12); color: var(--gray); border: 1px solid rgba(107,114,128,0.3); }

  /* PARLAY SECTION */
  .parlay-grid {
    padding: 8px 20px 24px;
    max-width: 960px; margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }

  .parlay-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-top: 2px solid var(--green);
    border-radius: 10px; overflow: hidden;
    transition: transform 0.15s, border-color 0.15s;
  }
  .parlay-card:hover { transform: translateY(-2px); }

  .parlay-header { padding: 12px 14px 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .parlay-name { font-size: 0.85rem; font-weight: 800; color: var(--text); }
  .parlay-odds { font-size: 0.95rem; font-weight: 900; color: var(--green); }

  .parlay-legs { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 7px; }
  .parlay-leg { display: flex; align-items: flex-start; gap: 8px; }
  .leg-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-top: 5px; flex-shrink: 0; }
  .leg-text { font-size: 0.78rem; color: var(--sub); line-height: 1.4; }
  .leg-pick { color: var(--text); font-weight: 700; }

  .parlay-footer { padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; }
  .payout-label { font-size: 0.7rem; color: var(--sub); }
  .payout-val { font-size: 0.9rem; font-weight: 800; color: var(--green); }
  .parlay-reasoning { font-size: 0.75rem; color: var(--sub); padding: 0 14px 12px; line-height: 1.5; }

  /* TRACKER STRIP */
  .tracker-strip {
    background: var(--header);
    border-top: 1px solid var(--border);
    padding: 10px 20px;
    max-width: 960px; margin: 0 auto;
    display: flex; gap: 24px; flex-wrap: wrap; align-items: center;
  }
  .track-item { font-size: 0.75rem; color: var(--sub); }
  .track-item strong { color: var(--text); }
  .track-item.green strong { color: var(--green); }
  .track-item.red strong { color: var(--red); }

  /* EMPTY / LOADING */
  .empty { grid-column: 1/-1; text-align: center; padding: 40px; color: var(--sub); font-size: 0.85rem; }

  footer { text-align: center; padding: 16px 20px; font-size: 0.7rem; color: #475569; border-top: 1px solid var(--border); margin-top: 12px; }

  @media (max-width: 600px) {
    .picks-grid, .parlay-grid { grid-template-columns: 1fr; padding-left: 14px; padding-right: 14px; }
    .filter-bar, .section-header, .tracker-strip { padding-left: 14px; padding-right: 14px; }
    header { padding: 12px 14px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">SPORT<span>Y</span></div>
    <div style="font-size:0.7rem;color:var(--sub);letter-spacing:1px;">TODAY'S PICKS</div>
  </div>
  <div class="header-right">
    <div class="header-date" id="headerDate">—</div>
    <div class="header-updated" id="headerUpdated">—</div>
  </div>
</header>

<!-- TRACKER STRIP (compact, secondary) -->
<div style="background:var(--header);border-bottom:1px solid var(--border);padding:8px 20px;max-width:100%;">
  <div class="tracker-strip" style="max-width:960px;margin:0 auto;padding:0;">
    <div class="track-item">Record: <strong id="tRecord">—</strong></div>
    <div class="track-item green">Win Rate: <strong id="tWin">—</strong></div>
    <div class="track-item green">ROI: <strong id="tRoi">—</strong></div>
    <div class="track-item">Streak: <strong id="tStreak">—</strong></div>
  </div>
</div>

<!-- FILTERS -->
<div class="filter-bar" style="padding-top:16px;">
  <span class="pill active" data-filter="sport" data-val="ALL">All</span>
  <span class="pill" data-filter="sport" data-val="MLB">MLB</span>
  <span class="pill" data-filter="sport" data-val="NBA">NBA</span>
  <span class="pill" data-filter="sport" data-val="UFC">UFC</span>
  <span class="pill" data-filter="sport" data-val="NFL">NFL</span>
  <span style="width:1px;height:16px;background:var(--border);margin:0 4px;"></span>
  <span class="pill active" data-filter="type" data-val="ALL">All Types</span>
  <span class="pill" data-filter="type" data-val="moneyline">ML</span>
  <span class="pill" data-filter="type" data-val="total">Totals</span>
  <span class="pill" data-filter="type" data-val="prop">Props</span>
</div>

<!-- INDIVIDUAL PICKS -->
<div class="section-header">
  <div class="section-title">Today's Picks</div>
  <div class="section-count" id="picksCount">0 picks</div>
</div>
<div class="picks-grid" id="picksGrid">
  <div class="empty">Loading picks...</div>
</div>

<!-- PARLAY COMBOS -->
<div class="section-header" style="padding-top:24px;">
  <div class="section-title">Parlay Combos</div>
  <div class="section-count" id="parlayCount">0 combos</div>
</div>
<div class="parlay-grid" id="parlayGrid">
  <div class="empty">Loading combos...</div>
</div>

<footer>SPORTY by PMI &nbsp;·&nbsp; For entertainment purposes only &nbsp;·&nbsp; Always gamble responsibly</footer>

<script>
const DATA_URL = 'https://raw.githubusercontent.com/kteam472-cell/sporty-picks-data/main/picks.json';
let allPicks = [], allParlays = [];
let filters = { sport: 'ALL', type: 'ALL' };

async function load() {
  try {
    const res = await fetch(DATA_URL + '?t=' + Date.now());
    const data = await res.json();
    allPicks = data.picks || [];
    allParlays = data.parlays || [];
    renderHeader(data);
    renderTracker(data.record);
    renderPicks();
    renderParlays();
  } catch(e) {
    document.getElementById('picksGrid').innerHTML = '<div class="empty">Could not load picks. Check back soon.</div>';
    document.getElementById('parlayGrid').innerHTML = '';
  }
}

function renderHeader(data) {
  const d = new Date(data.last_updated);
  document.getElementById('headerDate').textContent =
    d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
  document.getElementById('headerUpdated').textContent =
    'Last updated ' + d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
}

function renderTracker(r) {
  if (!r) return;
  document.getElementById('tRecord').textContent = `${r.wins}-${r.losses}${r.pushes>0?'-'+r.pushes:''}`;
  document.getElementById('tWin').textContent = r.win_rate || '—';
  document.getElementById('tRoi').textContent = r.roi || '—';
  document.getElementById('tStreak').textContent = r.streak || '—';
  const streakEl = document.getElementById('tStreak');
  streakEl.parentElement.className = 'track-item ' + (r.streak?.startsWith('W') ? 'green' : r.streak?.startsWith('L') ? 'red' : '');
  const roiEl = document.getElementById('tRoi');
  roiEl.parentElement.className = 'track-item ' + (r.roi?.startsWith('+') ? 'green' : r.roi?.startsWith('-') ? 'red' : '');
}

function fmtOdds(o) { return o > 0 ? '+'+o : String(o); }
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts), now = new Date();
  const prefix = d.toDateString()===now.toDateString() ? 'Today' :
    d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  return prefix + ' · ' + d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
function confDots(level) {
  const l = (level||'').toLowerCase();
  const cls = l==='high' ? '' : l==='medium' ? 'med' : 'low';
  const filled = l==='high' ? 3 : l==='medium' ? 2 : 1;
  return [0,1,2].map(i => `<div class="conf-dot${i<filled?' on '+cls:''}"></div>`).join('');
}
function typeLabel(t) {
  return {moneyline:'Money Line',total:'Total',prop:'Player Prop'}[t] || t;
}

function renderPicks() {
  const grid = document.getElementById('picksGrid');
  const filtered = allPicks.filter(p => {
    if (filters.sport !== 'ALL' && p.sport !== filters.sport) return false;
    if (filters.type !== 'ALL' && p.type !== filters.type) return false;
    return true;
  });
  document.getElementById('picksCount').textContent = filtered.length + ' pick' + (filtered.length!==1?'s':'');
  if (!filtered.length) { grid.innerHTML = '<div class="empty">No picks match your filters.</div>'; return; }
  grid.innerHTML = filtered.map(p => `
    <div class="pick-card ${(p.status||'').toLowerCase()}">
      <div class="sporty-tag">⚡ SPORTY</div>
      <div class="card-top">
        <div class="card-meta">
          <span class="sport-badge sport-${p.sport}">${p.sport}</span>
          <span class="type-badge">${typeLabel(p.type)}</span>
        </div>
        <div class="game-name">${p.game}</div>
        <div class="game-time-small">${fmtTime(p.game_time)}</div>
      </div>
      <div class="card-body">
        <div class="pick-main">
          <span class="pick-label">${p.pick}</span>
          <span class="pick-odds-val">${fmtOdds(p.odds)}</span>
        </div>
        <div class="conf-row">
          <div class="conf-dots">${confDots(p.confidence)}</div>
          <span class="conf-text">${p.confidence} Confidence</span>
          <span class="edge-chip">+${p.edge_pct}% edge</span>
        </div>
        <div class="reasoning-text">${p.reasoning}</div>
      </div>
      <div class="card-footer">
        <span class="units-info">Stake: <span>${p.units}u</span></span>
        <span class="status-chip status-${p.status}">${p.status}</span>
      </div>
    </div>
  `).join('');
}

function renderParlays() {
  const grid = document.getElementById('parlayGrid');
  document.getElementById('parlayCount').textContent = allParlays.length + ' combo' + (allParlays.length!==1?'s':'');
  if (!allParlays.length) { grid.innerHTML = '<div class="empty">No combos today.</div>'; return; }
  grid.innerHTML = allParlays.map(p => `
    <div class="parlay-card">
      <div class="parlay-header">
        <span class="parlay-name">${p.name}</span>
        <span class="parlay-odds">${p.combined_odds}</span>
      </div>
      <div class="parlay-legs">
        ${p.legs.map(l => `
          <div class="parlay-leg">
            <div class="leg-dot"></div>
            <div class="leg-text"><span class="leg-pick">${l.pick}</span> &nbsp;${fmtOdds(l.odds)}<br><span style="font-size:0.72rem">${l.game}</span></div>
          </div>
        `).join('')}
      </div>
      <div class="parlay-reasoning">${p.reasoning}</div>
      <div class="parlay-footer">
        <span class="payout-label">$10 bet pays</span>
        <span class="payout-val">${p.payout_on_10}</span>
      </div>
    </div>
  `).join('');
}

document.querySelectorAll('.pill').forEach(pill => {
  pill.addEventListener('click', () => {
    const ft = pill.dataset.filter, val = pill.dataset.val;
    filters[ft] = val;
    document.querySelectorAll(`.pill[data-filter="${ft}"]`).forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    renderPicks();
  });
});

load();
</script>
</body>
</html>
