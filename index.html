<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPORTY — AI Picks</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #1a1a2e;
    --card:      #16213e;
    --card2:     #0f3460;
    --border:    #1e2d5a;
    --green:     #53d337;
    --red:       #ef4444;
    --amber:     #f59e0b;
    --gray:      #6b7280;
    --text:      #ffffff;
    --sub:       #94a3b8;
    --header:    #0d0d1a;
    --mlb:       #3b82f6;
    --nba:       #f97316;
    --ufc:       #ef4444;
    --nfl:       #53d337;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--header);
    border-bottom: 2px solid var(--green);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .logo {
    font-size: 1.6rem;
    font-weight: 900;
    letter-spacing: 3px;
    color: var(--text);
  }
  .logo span { color: var(--green); }
  .tagline { font-size: 0.8rem; color: var(--sub); letter-spacing: 1px; text-transform: uppercase; }
  .last-updated { font-size: 0.75rem; color: var(--sub); }

  /* STATS BAR */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 20px 24px 0;
    max-width: 900px;
    margin: 0 auto;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    text-align: center;
  }
  .stat-label { font-size: 0.7rem; color: var(--sub); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .stat-value { font-size: 1.4rem; font-weight: 800; color: var(--text); }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }

  /* FILTERS */
  .filters {
    padding: 20px 24px 12px;
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filter-label { font-size: 0.7rem; color: var(--sub); text-transform: uppercase; letter-spacing: 1px; width: 48px; }
  .pill {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--sub);
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    letter-spacing: 0.5px;
  }
  .pill:hover { border-color: var(--green); color: var(--text); }
  .pill.active { background: var(--green); border-color: var(--green); color: #000; }

  /* PICKS GRID */
  .picks-container {
    padding: 16px 24px 40px;
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 14px;
  }

  /* PICK CARD */
  .pick-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: transform 0.15s, border-color 0.15s;
  }
  .pick-card:hover { transform: translateY(-2px); border-color: #2a3a6a; }
  .pick-card.won { border-left: 3px solid var(--green); }
  .pick-card.lost { border-left: 3px solid var(--red); }
  .pick-card.pending { border-left: 3px solid var(--amber); }
  .pick-card.push { border-left: 3px solid var(--gray); }

  .card-header {
    padding: 12px 14px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .card-left { display: flex; align-items: center; gap: 10px; }

  .sport-badge {
    padding: 3px 9px;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .sport-MLB { background: rgba(59,130,246,0.2); color: #60a5fa; }
  .sport-NBA { background: rgba(249,115,22,0.2); color: #fb923c; }
  .sport-UFC { background: rgba(239,68,68,0.2); color: #f87171; }
  .sport-NFL { background: rgba(83,211,55,0.2); color: var(--green); }

  .game-info { }
  .game-matchup { font-size: 0.9rem; font-weight: 700; color: var(--text); }
  .game-time { font-size: 0.72rem; color: var(--sub); margin-top: 1px; }

  .status-badge {
    padding: 4px 10px;
    border-radius: 5px;
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .status-PENDING { background: rgba(245,158,11,0.15); color: var(--amber); border: 1px solid rgba(245,158,11,0.3); }
  .status-WON { background: rgba(83,211,55,0.15); color: var(--green); border: 1px solid rgba(83,211,55,0.3); }
  .status-LOST { background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
  .status-PUSH { background: rgba(107,114,128,0.15); color: var(--gray); border: 1px solid rgba(107,114,128,0.3); }

  .card-body { padding: 12px 14px; }

  .pick-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .pick-name { font-size: 1.05rem; font-weight: 800; color: var(--text); }
  .pick-odds { font-size: 1rem; font-weight: 700; color: var(--green); }

  .confidence-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    gap: 10px;
  }
  .conf-bar { display: flex; gap: 3px; flex: 1; }
  .conf-seg {
    height: 5px;
    border-radius: 2px;
    flex: 1;
    background: var(--border);
  }
  .conf-seg.filled { background: var(--green); }
  .conf-seg.filled.medium { background: #a3d96e; }
  .conf-seg.filled.low { background: var(--amber); }

  .conf-meta { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .conf-label { font-size: 0.75rem; color: var(--sub); }
  .edge-badge {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--green);
    background: rgba(83,211,55,0.1);
    padding: 2px 7px;
    border-radius: 4px;
  }

  .reasoning {
    font-size: 0.8rem;
    color: var(--sub);
    line-height: 1.5;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  .card-footer {
    padding: 8px 14px;
    display: flex;
    justify-content: flex-end;
    border-top: 1px solid var(--border);
  }
  .units-label { font-size: 0.72rem; color: var(--sub); font-weight: 600; }
  .units-val { font-size: 0.72rem; color: var(--green); font-weight: 800; margin-left: 4px; }

  /* EMPTY STATE */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--sub);
  }
  .empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }
  .empty-state p { font-size: 0.9rem; }

  /* LOADING */
  .loading {
    text-align: center;
    padding: 80px 20px;
    color: var(--sub);
    font-size: 0.9rem;
    grid-column: 1 / -1;
  }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 20px;
    font-size: 0.72rem;
    color: var(--sub);
    border-top: 1px solid var(--border);
  }

  @media (max-width: 600px) {
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
    .picks-container { grid-template-columns: 1fr; padding: 12px 16px 40px; }
    .stats-bar, .filters { padding-left: 16px; padding-right: 16px; }
    header { padding: 14px 16px; }
    .logo { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">SPORT<span>Y</span></div>
    <div class="tagline">AI-Powered Daily Picks</div>
  </div>
  <div class="last-updated" id="lastUpdated">Loading...</div>
</header>

<div class="stats-bar">
  <div class="stat-card">
    <div class="stat-label">Record</div>
    <div class="stat-value" id="statRecord">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Win Rate</div>
    <div class="stat-value green" id="statWinRate">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">ROI</div>
    <div class="stat-value green" id="statRoi">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Streak</div>
    <div class="stat-value" id="statStreak">—</div>
  </div>
</div>

<div class="filters">
  <div class="filter-row">
    <span class="filter-label">Sport</span>
    <span class="pill active" data-filter="sport" data-val="ALL">All</span>
    <span class="pill" data-filter="sport" data-val="MLB">MLB</span>
    <span class="pill" data-filter="sport" data-val="NBA">NBA</span>
    <span class="pill" data-filter="sport" data-val="UFC">UFC</span>
    <span class="pill" data-filter="sport" data-val="NFL">NFL</span>
  </div>
  <div class="filter-row">
    <span class="filter-label">Status</span>
    <span class="pill active" data-filter="status" data-val="ALL">All</span>
    <span class="pill" data-filter="status" data-val="PENDING">Pending</span>
    <span class="pill" data-filter="status" data-val="WON">Won</span>
    <span class="pill" data-filter="status" data-val="LOST">Lost</span>
  </div>
</div>

<div class="picks-container" id="picksGrid">
  <div class="loading">Loading picks...</div>
</div>

<footer>
  SPORTY by PMI &nbsp;|&nbsp; For entertainment purposes only &nbsp;|&nbsp; Past performance does not guarantee future results
</footer>

<script>
  const DATA_URL = 'https://raw.githubusercontent.com/kteam472-cell/sporty-picks-data/main/picks.json';

  let allPicks = [];
  let filters = { sport: 'ALL', status: 'ALL' };

  async function loadPicks() {
    try {
      const res = await fetch(DATA_URL + '?t=' + Date.now());
      const data = await res.json();
      allPicks = data.picks || [];
      renderStats(data.record);
      renderLastUpdated(data.last_updated);
      renderPicks();
    } catch (e) {
      document.getElementById('picksGrid').innerHTML =
        '<div class="empty-state"><div class="empty-icon">📡</div><p>Could not load picks. Check back soon.</p></div>';
    }
  }

  function renderStats(record) {
    if (!record) return;
    document.getElementById('statRecord').textContent =
      `${record.wins}-${record.losses}${record.pushes > 0 ? '-' + record.pushes : ''}`;
    document.getElementById('statWinRate').textContent = record.win_rate || '—';
    const roi = record.roi || '0%';
    const roiEl = document.getElementById('statRoi');
    roiEl.textContent = roi;
    roiEl.className = 'stat-value ' + (roi.startsWith('+') ? 'green' : roi.startsWith('-') ? 'red' : '');
    const streak = record.streak || '—';
    const streakEl = document.getElementById('statStreak');
    streakEl.textContent = streak;
    streakEl.className = 'stat-value ' + (streak.startsWith('W') ? 'green' : streak.startsWith('L') ? 'red' : '');
  }

  function renderLastUpdated(ts) {
    if (!ts) return;
    const d = new Date(ts);
    document.getElementById('lastUpdated').textContent =
      'Updated ' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
      ' at ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }

  function formatOdds(odds) {
    return odds > 0 ? '+' + odds : String(odds);
  }

  function formatGameTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const now = new Date();
    const today = now.toDateString();
    const gameDay = d.toDateString();
    const prefix = gameDay === today ? 'Today' :
      d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    return prefix + ' · ' + time;
  }

  function confSegments(level) {
    const lvl = (level || '').toLowerCase();
    if (lvl === 'high') return [true, true, true];
    if (lvl === 'medium') return [true, true, false];
    return [true, false, false];
  }

  function renderPicks() {
    const grid = document.getElementById('picksGrid');
    const filtered = allPicks.filter(p => {
      if (filters.sport !== 'ALL' && p.sport !== filters.sport) return false;
      if (filters.status !== 'ALL' && p.status !== filters.status) return false;
      return true;
    });

    if (filtered.length === 0) {
      grid.innerHTML = '<div class="empty-state"><div class="empty-icon">🎯</div><p>No picks match your filters.</p></div>';
      return;
    }

    const lvlClass = (level) => {
      const l = (level || '').toLowerCase();
      return l === 'high' ? '' : l === 'medium' ? 'medium' : 'low';
    };

    grid.innerHTML = filtered.map(p => {
      const segs = confSegments(p.confidence);
      const lc = lvlClass(p.confidence);
      return `
        <div class="pick-card ${(p.status || '').toLowerCase()}">
          <div class="card-header">
            <div class="card-left">
              <span class="sport-badge sport-${p.sport}">${p.sport}</span>
              <div class="game-info">
                <div class="game-matchup">${p.game}</div>
                <div class="game-time">${formatGameTime(p.game_time)}</div>
              </div>
            </div>
            <span class="status-badge status-${p.status}">${p.status}</span>
          </div>
          <div class="card-body">
            <div class="pick-row">
              <span class="pick-name">${p.pick}</span>
              <span class="pick-odds">${formatOdds(p.odds)}</span>
            </div>
            <div class="confidence-row">
              <div class="conf-bar">
                ${segs.map(f => `<div class="conf-seg${f ? ' filled ' + lc : ''}"></div>`).join('')}
              </div>
              <div class="conf-meta">
                <span class="conf-label">${p.confidence} Confidence</span>
                <span class="edge-badge">+${p.edge_pct}% edge</span>
              </div>
            </div>
            <div class="reasoning">${p.reasoning}</div>
          </div>
          <div class="card-footer">
            <span class="units-label">Stake:</span>
            <span class="units-val">${p.units}u</span>
          </div>
        </div>
      `;
    }).join('');
  }

  // Filter pill clicks
  document.querySelectorAll('.pill').forEach(pill => {
    pill.addEventListener('click', () => {
      const filterType = pill.dataset.filter;
      const val = pill.dataset.val;
      filters[filterType] = val;
      document.querySelectorAll(`.pill[data-filter="${filterType}"]`).forEach(p => p.classList.remove('active'));
      pill.classList.add('active');
      renderPicks();
    });
  });

  loadPicks();
</script>
</body>
</html>
